# Hard-negative-aware training profile.
#
# Use with SyntheticDroneDataset (which samples sequence_type per item) or
# CachedEvalDataset (which enumerates the type axis from the manifest). The
# sequence_type below is just the "base" used when a wrapper does not override
# it — the dataset mixtures and eval manifest are responsible for varying it.

n_frames: 20
canvas_shape: [256, 256]

sequence_type: positive_uav
snr_db: -10.0

target_sigma: 1.0

motion: cv
maneuvers: false
maneuver_prob: 0.1
heading_std_rad: 0.4
brownian_std_px: 0.1
speed_min_px_per_frame: 0.3
speed_max_px_per_frame: 1.5
accel_std_px_per_frame_sq: 0.0

noise_sigma: 1.0
clutter_rms: 0.5
clutter_spectral_exponent: 2.0
clutter_drift_px_per_frame: 0.2

dropout_prob: 0.0
dropout_mode: blank
jitter_std_px: 0.5

# Target visibility dropout — the thesis cares about temporal accumulation
# when the UAV is not visible every frame.
target_dropout_enabled: true
target_dropout_prob: 0.15
target_dropout_mode: bernoulli
target_min_visible_frames: 3

# Distractor envelope: weak hard negatives at low SNR, drone-ish in places.
distractors_enabled: true
distractor_count_min: 1
distractor_count_max: 4
distractor_types: [static_hot_pixel, flicker_blob, moving_false_blob, false_tracklet, multi_noise_dots]
distractor_peak_snr_db_min: -15.0
distractor_peak_snr_db_max: 0.0
distractor_sigma_min: 0.5
distractor_sigma_max: 2.0
distractor_lifetime_min: 2
distractor_lifetime_max: 10
distractor_dropout_prob: 0.05
distractor_motion_max_px: 2.5

boundary_margin_px: 4.0
seed: 0
