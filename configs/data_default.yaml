# Default knobs for the synthetic data generator.
# Override per experiment via CLI flags. Field names match SequenceConfig exactly.

n_frames: 10
canvas_shape: [256, 256]

# Sequence type: positive_uav | empty_background | hard_negative | mixed_uav_and_distractors
sequence_type: positive_uav

snr_db: 0.0

target_sigma: 1.0

motion: cv
maneuvers: false
maneuver_prob: 0.05
heading_std_rad: 0.3
brownian_std_px: 0.1
speed_min_px_per_frame: 0.3
speed_max_px_per_frame: 1.5
accel_std_px_per_frame_sq: 0.0

noise_sigma: 1.0
clutter_rms: 0.0
clutter_spectral_exponent: 2.0
clutter_drift_px_per_frame: 0.0

# Frame-level / sensor corruption
dropout_prob: 0.0
dropout_mode: blank
jitter_std_px: 0.0

# Target-level visibility intermittency (zero PSF on dropped frames; bg untouched)
target_dropout_enabled: false
target_dropout_prob: 0.0
target_dropout_mode: bernoulli
target_min_visible_frames: 1

# Distractors (hard negatives) — disabled by default; always rendered for
# hard_negative and mixed_uav_and_distractors regardless of this flag.
distractors_enabled: false
distractor_count_min: 0
distractor_count_max: 0
distractor_types: [static_hot_pixel, flicker_blob, moving_false_blob, false_tracklet, multi_noise_dots]
distractor_peak_snr_db_min: -20.0
distractor_peak_snr_db_max: 5.0
distractor_sigma_min: 0.5
distractor_sigma_max: 2.0
distractor_lifetime_min: 1
distractor_lifetime_max: 10
distractor_dropout_prob: 0.0
distractor_motion_max_px: 3.0

boundary_margin_px: 4.0
seed: 0
